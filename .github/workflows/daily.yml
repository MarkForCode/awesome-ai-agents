name: daily

on:
  workflow_dispatch: # 先只開手動執行，測試用
  # schedule:
  #   - cron: "23 21 * * *" # 台北 05:23（與 Claude 排程並行對照期）；切換後改回 "23 22 * * *" = 06:23

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # 不傳 github_token input：改用 Claude GitHub App 身分推送，PR 才會觸發 build.yml 檢查
      - uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }} # 給 build.py --refresh 與 Search API 提高額度
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            讀 AGENTS.md，照「每日流程」執行；今天若是週日（台北時間），也做「每週日額外工作」。
            這次在 GitHub Actions 上執行，runner 是 UTC：日期一律用 `TZ=Asia/Taipei date +%F`（週次用 `TZ=Asia/Taipei date +%G-W%V`）。
            最後推送 daily/YYYY-MM-DD 分支並開 PR 到 main，不要直接推送 main。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,WebSearch,WebFetch,Bash(git:*),Bash(python:*),Bash(python3:*),Bash(curl:*),Bash(gh:*),Bash(date:*),Bash(TZ=Asia/Taipei date:*)"
