name: build

on:
  push:
    branches: [main]
    paths: ["data/projects.yml", "daily/**", "weekly/**", "scripts/**"]
  pull_request:
    paths: ["data/projects.yml", "scripts/**"]
  schedule:
    - cron: "17 0 * * *" # 每天台北時間 08:17 更新星星數
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 檢查資料
        run: python scripts/build.py --check
      - name: 更新數據並產生 README 與網站
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --refresh
      - name: 提交變更
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自動更新數據與頁面"
          git push
