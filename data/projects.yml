# 唯一資料來源。README 與網站都由 scripts/build.py 從這裡產生，請勿直接改 README。
# 欄位：repo（必填）、summary 一句話介紹（必填）、for 適合誰（必填）、note 注意事項（選填）、added 收錄日期（必填）
# 星星數、授權、語言、最後更新時間由 GitHub API 自動取得（data/stats.json），不要手動填。

categories:
  - id: learn
    name: 入門學習
    desc: 從零開始理解 AI Agent 與 MCP 的課程、教材與指南。
    projects:
      - repo: microsoft/ai-agents-for-beginners
        summary: 微軟出的 18 堂 AI Agent 入門課，每堂都有講義和可執行的範例程式。
        for: 第一次接觸 Agent、想有系統學起來的開發者
        added: 2026-11-10
      - repo: huggingface/agents-course
        summary: Hugging Face 的免費 Agent 課程，涵蓋 smolagents、LangChain、LlamaIndex 等主流工具。
        for: 想邊學邊動手、順便比較不同框架的人
        added: 2026-11-10
      - repo: microsoft/mcp-for-beginners
        summary: MCP（Model Context Protocol）入門教材，用 Python、TypeScript、Java、C# 等多種語言示範怎麼寫 MCP server 和 client。
        for: 想自己寫 MCP 工具的開發者
        added: 2026-11-10
      - repo: shareAI-lab/learn-claude-code
        summary: 從零打造一個類似 Claude Code 的迷你 Agent，一步步拆解「Agent 外殼」是怎麼運作的。
        for: 好奇程式碼 Agent 內部原理的人
        added: 2026-11-10
      - repo: NirDiamant/GenAI_Agents
        summary: 50 多個 Agent 技巧的教學與實作，從簡單的聊天機器人到複雜的多 Agent 系統都有。
        for: 想找具體範例參考的開發者
        added: 2026-11-10
      - repo: NirDiamant/agents-towards-production
        summary: 以程式碼為主的教學，示範 Agent 從原型走到正式上線要處理的部署、監控、安全等問題。
        for: 準備把 Agent 放進正式產品的團隊
        added: 2026-11-10
      - repo: dair-ai/Prompt-Engineering-Guide
        summary: 提示工程經典指南，內容已擴充到 context engineering、RAG 與 Agent。
        for: 所有要跟 LLM 打交道的人
        note: 2026 年 3 月後就沒有新的 commit，較新的技巧可能還沒收進來
        added: 2026-11-10

  - id: frameworks
    name: Agent 開發框架
    desc: 用程式碼打造自己的 Agent。
    projects:
      - repo: langchain-ai/langchain
        summary: 最多人用的 LLM 應用框架，串接模型、工具、資料來源的生態系最完整。
        for: 需要大量現成整合的專案
        note: 抽象層較多，簡單需求可能殺雞用牛刀
        added: 2026-11-10
      - repo: langchain-ai/langgraph
        summary: 用「圖」來描述 Agent 流程，能精準控制每一步、支援中斷與恢復。
        for: 流程複雜、需要可靠性的 Agent
        added: 2026-11-10
      - repo: crewAIInc/crewAI
        summary: 讓多個扮演不同角色的 Agent 分工合作，例如研究員＋寫手＋審稿員。
        for: 想快速做出多 Agent 協作的人
        added: 2026-11-10
      - repo: agno-agi/agno
        summary: 輕量、速度快的 Python Agent 框架，內建記憶、知識庫與多 Agent 團隊。
        for: 想要簡潔 API 的 Python 開發者
        added: 2026-11-10
      - repo: pydantic/pydantic-ai
        summary: Pydantic 團隊出品，從輸入到輸出都有完整型別檢查的 Agent 框架。
        for: 重視型別安全、習慣 FastAPI 風格的人
        added: 2026-11-10
      - repo: google/adk-python
        summary: Google 官方 Agent Development Kit，涵蓋開發、評估到部署。
        for: 使用 Gemini 或 Google Cloud 的團隊
        added: 2026-11-10
      - repo: agentscope-ai/agentscope
        summary: 阿里巴巴開源的多 Agent 框架，強調流程透明、可觀察，支援 MCP。
        for: 需要看清楚 Agent 每一步在做什麼的人
        added: 2026-11-10
      - repo: FoundationAgents/MetaGPT
        summary: 模擬一間軟體公司，讓產品經理、架構師、工程師等 Agent 協作寫出軟體。
        for: 研究多 Agent 角色分工的人
        note: 2026 年 1 月後就沒有新的 commit，維護狀況不明，正式專案使用前先評估
        added: 2026-11-10
      - repo: deepset-ai/haystack
        summary: 以模組化管線為核心的框架，特別擅長檢索（RAG）和可控的 Agent 流程。
        for: 以文件檢索為主的企業應用
        added: 2026-11-10
      - repo: letta-ai/letta
        summary: 前身是 MemGPT，打造有長期記憶、會隨使用持續學習的 Agent。
        for: 需要 Agent 記住使用者的應用
        added: 2026-11-10

  - id: coding
    name: 程式開發 Agent
    desc: 在終端機或編輯器裡幫你寫程式的 Agent。
    projects:
      - repo: google-gemini/gemini-cli
        summary: Google 開源的終端機 Agent，直接在命令列用 Gemini 讀寫程式碼、執行指令。
        for: 想要免費額度、在終端機工作的開發者
        added: 2026-11-10
      - repo: QwenLM/qwen-code
        summary: 通義千問團隊的終端機程式 Agent，針對 Qwen 系列模型最佳化。
        for: 想用開源模型寫程式的人
        added: 2026-11-10
      - repo: aaif-goose/goose
        summary: 可擴充的開源 Agent，不只建議程式碼，還能安裝套件、執行、測試，支援任何 LLM 與 MCP。
        for: 想要不綁定模型廠商的程式 Agent
        added: 2026-11-10
      - repo: openinterpreter/openinterpreter
        summary: 老牌開源專案，現在定位為給開源模型（Kimi、GLM 等）用的程式 Agent，以 Rust 改寫。
        for: 想在本機用開源模型寫程式的人
        added: 2026-11-10
      - repo: charmbracelet/crush
        summary: Charm 團隊出品、介面很漂亮的終端機程式 Agent，支援多家模型。
        for: 重視終端機體驗的開發者
        added: 2026-11-10
      - repo: Yeachan-Heo/oh-my-claudecode
        summary: Claude Code 的多 Agent 協作外掛，讓多個 Agent 分工處理大型任務。
        for: 重度 Claude Code 使用者
        added: 2026-11-10
      - repo: stablyai/orca
        summary: 同時管理一整隊程式 Agent（Claude Code、Codex 等），用你自己的訂閱，支援桌面、手機與遠端執行。
        for: 想讓多個 Agent 平行工作的人
        added: 2026-11-10
      - repo: KKKKhazix/agent-autoloop
        summary: 讓 Claude Code、Codex 等命令列 Agent 依規則在背景接手定時任務或 GitHub issue 等事件，需要人決定時才推卡片到飛書、Slack、Discord 或桌面通知。
        for: 想讓命令列 Agent 在沒人盯著時持續工作的人
        note: 文件以簡體中文為主；需要 Node 24 以上
        added: 2026-11-12
      - repo: devvmhq/devvm
        summary: 每個專案資料夾開一台獨立的 Lima 虛擬機，自動偵測需要的工具鏈，讓 Claude Code、Codex 等 Agent 在裡面工作，預設只能連到允許的網域。
        for: 想讓程式 Agent 放手做事、又不想讓它碰到本機的人
        note: 支援 macOS 13 以上與 Linux；作者提醒沙盒無法堵住所有漏洞，使用前先看安全說明
        added: 2026-11-12
      - repo: alexeyw/lot-map
        summary: Claude Code 外掛，在對話旁開一個即時地圖，工具呼叫、模型請求、hook、技能和子 Agent 執行時會亮起對應的站點，也顯示 context 用量與錯誤。
        for: 想一眼看懂 Claude Code 正在做什麼、卡在哪裡的人
        note: 作者在 macOS 上開發測試；終端機版需要至少 144 欄寬
        added: 2026-11-13
      - repo: leostera/git-twig
        summary: git 子指令，在 APFS、Btrfs 等支援寫入時複製的檔案系統上建立共用檔案內容的 worktree，讓多個 Agent 各開一份工作目錄時不必重複佔用硬碟空間。
        for: 常讓多個程式 Agent 同時在不同 worktree 工作、大型 repo 很吃空間的人
        note: 一般 ext4 不支援，會改用原本的 git worktree；小型 repo 建立速度反而比較慢
        added: 2026-11-17
      - repo: stevenmichaelthomas/numbrone
        summary: 架在 herdr 上的 Agent 分工 Skill：你只跟一個總管 Agent 下需求，它判斷屬於哪個專案再交給該專案的經理 Agent，經理開工人 Agent 各自在獨立 worktree 做事並回報。
        for: 同時維護好幾個專案、想讓程式 Agent 平行處理多件事的人
        note: 需要先安裝 herdr，只支援 macOS 與 Linux；同時跑多個 Agent 會比較耗 token
        added: 2026-11-17
      - repo: imuratalpay/ui-diff
        summary: 改到介面的 PR 自動在修改前後的版本各截一次圖，比對像素差異並附上簡短的 UX 摘要，整理成一則固定的 PR 留言；可當 Agent Skill 用，也能從 CLI 或 CI 直接跑。
        for: 用 Agent 改前端、想讓審查者不必自己跑起來就看到畫面變化的團隊
        note: 需要 Node.js 20.10+，Windows 要用 WSL2；截圖存在同一個 repo 的孤立分支裡
        added: 2026-11-22

  - id: browser
    name: 瀏覽器與電腦操作
    desc: 讓 Agent 操作網頁、桌面應用程式。
    projects:
      - repo: browser-use/browser-use
        summary: 讓 AI 操作瀏覽器的 Python 函式庫，能點擊、填表、跨網頁完成任務。
        for: 想自動化網頁操作的開發者
        added: 2026-11-10
      - repo: browser-use/browser-harness
        summary: 讓 Claude Code、Codex、Cursor 直接使用你已登入的 Chrome，一個提示就能設定好。
        for: 想讓程式 Agent 存取需要登入的網站
        note: Agent 會以你的身分操作，要留意權限
        added: 2026-11-10
      - repo: Skyvern-AI/skyvern
        summary: 結合 LLM 與視覺辨識的瀏覽器自動化，網站改版也不容易壞。
        for: 需要長期跑表單、下單等網頁流程的團隊
        note: AGPL-3.0 授權，商用前要留意
        added: 2026-11-10
      - repo: trycua/cua
        summary: 電腦操作（computer-use）Agent 的基礎設施，提供跨作業系統沙盒、驅動程式和評測基準。
        for: 開發或訓練桌面操作 Agent 的人
        added: 2026-11-10
      - repo: microsoft/playwright-mcp
        summary: 微軟官方 Playwright MCP server，讓 Agent 透過結構化的頁面資訊操作瀏覽器。
        for: 想讓 Claude、Cursor 等工具操作網頁的人
        added: 2026-11-10
      - repo: ChromeDevTools/chrome-devtools-mcp
        summary: Chrome 官方 DevTools MCP，讓程式 Agent 能看 console、網路請求、效能數據來除錯。
        for: 前端開發者
        added: 2026-11-10
      - repo: DIYgod/pinky
        summary: 透過 MCP 讓 Agent 操作真實的 iPhone 或 Android 手機，付款等高風險步驟要你在電腦上按允許才會執行，並保留每一步的截圖與錄影。
        for: 想讓 Agent 代操手機 App、又要保留控制權的人
        note: 仍在 pre-alpha 階段
        added: 2026-11-12
      - repo: vostride/agent-qa
        summary: 用自然語言描述使用流程，由 Agent 在網頁、Android 或 iOS 上實際操作測試，失敗時留下對應步驟的截圖；可從 CLI、儀表板或透過 MCP 從程式 Agent 呼叫，並把測試中學到的經驗存成 repo 裡可審查的檔案。
        for: 想讓程式 Agent 跑端對端測試的開發者與 QA 工程師
        note: FSL-1.1-ALv2 授權（原始碼公開，兩年後轉為 Apache-2.0，期間限制競爭用途），不是 OSI 認可的開源授權；需要 Node.js 24 以上，模型費用另計
        added: 2026-11-12
      - repo: lxe/phoneuse
        summary: 不越獄、不接線，用 AirPlay 把 iPhone 畫面鏡像到電腦，再讓電腦假裝成藍牙滑鼠鍵盤來操作，你或 Claude Code 等 Agent 都能點擊、輸入。
        for: 想讓 Agent 操作 iPhone、又不想在手機上裝特殊工具的人
        note: 仍是 alpha；以 Linux 為主，Mac 版需另購一塊 LilyGO T-Display 開發板當橋接器，Windows 要從原始碼安裝；手機和電腦須在同一個 Wi-Fi
        added: 2026-11-13
      - repo: paul-nameless/agweb
        summary: 以 WebKit 打造、專給程式 Agent 用的 macOS 瀏覽器，Agent 從終端機下類似 playwright-cli 的指令操作，視窗不搶鍵盤焦點，多個 Agent 的分頁集中在一個儀表板即時顯示。
        for: 同時跑好幾個程式 Agent、受不了 Playwright 視窗搶焦點的 Mac 使用者
        note: 需要 macOS 26 以上；只支援 WebKit，沒有 Chrome DevTools Protocol
        added: 2026-11-16
      - repo: Tthanh2k6/turbo-browser-mcp
        summary: 以 Playwright 為基礎的瀏覽器 MCP 伺服器，把幾十個細碎操作合併成 10 個批次工具，只回傳頁面變動的部分，一次呼叫就能填完整份表單，以減少 token 和來回次數。
        for: 覺得瀏覽器 MCP 太耗 token、回合數太多的 Agent 開發者
        note: 個人專案、剛發布不久；效能數字來自作者自己的基準測試
        added: 2026-11-16
      - repo: hridaya423/phonedriver
        summary: MCP 伺服器與 CLI，把 Android 或 iOS 畫面轉成編號清單讓 Agent 點選操作，遇到付款、刪除帳號等按鈕會先暫停問你。
        for: 想讓 Claude Code、Codex 等 Agent 操作手機或測試自家 App 的人
        note: AGPL-3.0 授權；iPhone 實機需要 Mac、Xcode 與 Apple 開發者憑證；付款按鈕偵測靠文字標籤，只有圖示的按鈕抓不到
        added: 2026-11-17

