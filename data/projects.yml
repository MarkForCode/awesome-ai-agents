# 唯一資料來源。README 與網站都由 scripts/build.py 從這裡產生，請勿直接改 README。
# 欄位：repo（必填）、summary 一句話介紹（必填）、for 適合誰（必填）、note 注意事項（選填）、added 收錄日期（必填）
# 星星數、授權、語言、最後更新時間由 GitHub API 自動取得（data/stats.json），不要手動填。

categories:
  - id: learn
    name: 入門學習
    desc: 從零開始理解 AI Agent 與 MCP 的課程、教材與指南。
    projects:
      - repo: microsoft/ai-agents-for-beginners
        summary: 微軟出的 18 堂 AI Agent 入門課，每堂都有講義和可執行的範例程式。
        for: 第一次接觸 Agent、想有系統學起來的開發者
        added: 2026-11-10
      - repo: huggingface/agents-course
        summary: Hugging Face 的免費 Agent 課程，涵蓋 smolagents、LangChain、LlamaIndex 等主流工具。
        for: 想邊學邊動手、順便比較不同框架的人
        added: 2026-11-10
      - repo: microsoft/mcp-for-beginners
        summary: MCP（Model Context Protocol）入門教材，用 Python、TypeScript、Java、C# 等多種語言示範怎麼寫 MCP server 和 client。
        for: 想自己寫 MCP 工具的開發者
        added: 2026-11-10
      - repo: shareAI-lab/learn-claude-code
        summary: 從零打造一個類似 Claude Code 的迷你 Agent，一步步拆解「Agent 外殼」是怎麼運作的。
        for: 好奇程式碼 Agent 內部原理的人
        added: 2026-11-10
      - repo: NirDiamant/GenAI_Agents
        summary: 50 多個 Agent 技巧的教學與實作，從簡單的聊天機器人到複雜的多 Agent 系統都有。
        for: 想找具體範例參考的開發者
        added: 2026-11-10
      - repo: NirDiamant/agents-towards-production
        summary: 以程式碼為主的教學，示範 Agent 從原型走到正式上線要處理的部署、監控、安全等問題。
        for: 準備把 Agent 放進正式產品的團隊
        added: 2026-11-10
      - repo: dair-ai/Prompt-Engineering-Guide
        summary: 提示工程經典指南，內容已擴充到 context engineering、RAG 與 Agent。
        for: 所有要跟 LLM 打交道的人
        added: 2026-11-10

